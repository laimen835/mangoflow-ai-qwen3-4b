<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content"><meta name="theme-color" content="#173d34"><title>MangoFlow AI</title><link rel="stylesheet" href="chat.css?v=8"><link rel="icon" type="image/png" href="mangoflow-logo.png"><link rel="apple-touch-icon" href="mangoflow-logo.png"></head>
<body>
<main class="chat-shell">
  <header class="chat-header"><img class="assistant-symbol brand-logo" src="mangoflow-logo.png" alt=""><div class="identity"><h1>MangoFlow AI</h1><p id="connection" role="status">Студентам и абитуриентам</p></div><button id="new-chat" class="header-button" aria-label="Новый диалог" title="Новый диалог">＋</button><button id="close-chat" class="header-button" aria-label="Закрыть чат" title="Закрыть чат" hidden>×</button></header>
  <div id="chat-scroll" class="chat-scroll">
    <section id="welcome" class="welcome"><img class="welcome-symbol brand-logo" src="mangoflow-logo.png" alt="Логотип MangoFlow AI"><p class="eyebrow">РЯДОМ, КОГДА НУЖНО</p><h2>Об академии —<br>простыми словами.</h2><p>Помогу найти информацию.<br>Покажу, откуда взял ответ.</p><div class="suggestions"><button data-prompt="Где найти расписание СПК?">Расписание <span aria-hidden="true">↗</span></button><button data-prompt="Где посмотреть список преподавателей СПК?">Преподаватели <span aria-hidden="true">↗</span></button><button data-prompt="Какие документы нужны для поступления в СПК?">Поступление <span aria-hidden="true">↗</span></button></div></section>
    <div id="messages" class="messages" role="log" aria-label="Сообщения диалога" aria-live="off"></div>
  </div>
  <div id="chat-status" class="chat-status" role="status" aria-live="polite"></div>
  <footer class="composer-area"><form id="chat-form"><label class="sr-only" for="question">Ваш вопрос</label><textarea id="question" rows="1" maxlength="4000" placeholder="Что хотите узнать?"></textarea><button id="send" type="submit" aria-label="Отправить вопрос" title="Отправить вопрос">↑</button></form><p class="composer-note">Важные сведения сверяйте с источником.</p></footer>
</main>
<script src="answer-renderer.js?v=8"></script><script src="http.js?v=8"></script><script src="chat.js?v=8"></script>
</body></html>
